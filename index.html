<style>

:root{--bg:#04150f;--sap:#0a1f3a;--em:#0b3a2c;--gc:255,255,255;--ga:.06;--blur:18px;--glass:rgba(var(--gc),var(--ga));--line:rgba(212,175,90,.22);--gold:#d4af5a;--gold2:#a8894a;--tx:#eaf2ee;--mut:#8fa89e;--ok:#5fd6a0;--nav:rgba(4,21,15,.75);--inp:rgba(255,255,255,.07);--rb:rgba(255,255,255,.1);--on:#04150f;--skyo:.3}
html[data-theme=sapphire]{--bg:#050d1f;--sap:#12123d;--em:#0a2a5c;--gold:#e0c070;--nav:rgba(5,13,31,.75);--on:#050d1f}
html[data-theme=amber]{--bg:#1c0f05;--sap:#3a1a10;--em:#5a2e0a;--gold:#f0b45a;--gold2:#c08a3a;--tx:#fbefe2;--mut:#c9a98a;--nav:rgba(28,15,5,.78);--on:#1c0f05}
html[data-theme=light]{--bg:#eef3f1;--sap:#dbe6f5;--em:#cfe8dc;--gold:#8a6a1c;--gold2:#8a6a1c;--tx:#10231b;--mut:#4b6459;--ok:#1f8a5b;--line:rgba(138,106,28,.35);--nav:rgba(255,255,255,.75);--inp:rgba(255,255,255,.7);--rb:rgba(0,0,0,.1);--on:#fff;--skyo:.16}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 80% 0,var(--em) 0,transparent 55%),radial-gradient(circle at 0 100%,var(--sap) 0,transparent 55%),var(--bg);color:var(--tx);font-family:Tajawal,Cairo,sans-serif;padding-top:env(safe-area-inset-top);transition:background .6s}
#sky{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,var(--s1),transparent 60%),radial-gradient(circle at 20% 105%,var(--s2),transparent 60%);opacity:var(--skyo);transition:--s1 4s,--s2 4s}
#pc{position:fixed;inset:0;z-index:-1;pointer-events:none}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px}
.pg{display:none}.pg.on{display:block;animation:in .3s ease}

h2{font-size:20px;color:var(--gold);margin:0 0 10px}
.greet{padding:4px 4px 14px}.greet b{font-size:22px;display:block}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 0 24px rgba(212,175,90,.06);transition:transform .15s}
.card:active,.btn:active{transform:scale(.97)}
.btn{border:1px solid var(--gold2);background:rgba(212,175,90,.12);color:var(--gold);font:inherit;padding:10px 16px;border-radius:16px;transition:transform .15s}
.btn.glow{width:100%;font-size:17px;padding:14px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(212,175,90,.25)}50%{box-shadow:0 0 34px rgba(212,175,90,.55)}}
input{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:16px;color:var(--tx);font:inherit;font-size:16px;padding:12px;margin-bottom:12px}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--gold);margin:6px 0 14px}
.top{text-align:center;padding:20px;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 16px rgba(212,175,90,.12);transform:scale(1)}50%{box-shadow:0 0 38px rgba(212,175,90,.42);transform:scale(1.012)}}
.top .n{font-size:15px;color:var(--mut)}.top .p{font-size:26px;color:var(--gold)}.top .t{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;width:76px;height:76px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--rb)}.ring .fg{stroke:var(--gold);transition:stroke-dashoffset .4s;filter:drop-shadow(0 0 4px var(--gold))}
.ring.done .fg{stroke:var(--ok);filter:drop-shadow(0 0 7px var(--ok))}
.ring.done{animation:breathe 3.5s ease-in-out infinite;border-radius:50%}
.ring.pulse{animation:ringp .9s ease}
@keyframes ringp{0%{transform:scale(1)}40%{transform:scale(1.14);filter:drop-shadow(0 0 14px var(--gold))}100%{transform:scale(1)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.g{text-align:center;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tabs .btn{white-space:nowrap;padding:8px 14px}.tabs .btn.on{background:var(--gold);color:var(--on)}
.q{font-family:'Amiri Quran',Amiri,serif;font-size:26px;line-height:2.3;text-align:center}
.qv{display:block;font-family:'Amiri Quran',Amiri,serif;font-size:24px;line-height:2.3;text-align:center;font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.z{font-family:Tajawal,Cairo,sans-serif;font-size:19px;line-height:2.1;font-weight:500}
.src{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;color:var(--gold2);font-size:13px}
.tl{border-right:2px solid var(--line);padding-right:16px;margin-right:8px}
.tl .card{position:relative}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line)}

#cmp{width:230px;height:230px;margin:10px auto;border-radius:50%;border:2px solid var(--gold2);position:relative;box-shadow:0 0 34px rgba(212,175,90,.25),inset 0 0 30px rgba(0,0,0,.35)}

#needle{position:absolute;left:50%;top:8px;width:0;height:0;margin-left:-10px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:90px solid var(--gold);filter:drop-shadow(0 0 8px var(--gold))}
#cmp:after{content:"🕋";position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
:focus-visible{outline:2px solid var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fd{font-size:17px;line-height:2;margin-top:10px}
.tk{font-size:15px;color:var(--gold2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.q{font-size:var(--qfs,26px);text-align:justify;text-align-last:center}
.ay.bk{background:rgba(212,175,90,.13);border-radius:8px}
.ay.hl{background:rgba(212,175,90,.3);box-shadow:0 0 14px rgba(212,175,90,.5);border-radius:8px}
.an{color:var(--gold);font-size:.75em;cursor:pointer;padding:0 2px}
.pgm{display:block;text-align:center;font:12px Tajawal,sans-serif;color:var(--mut);margin:10px 0}
.bsm{text-align:center;color:var(--gold);margin-bottom:8px}
.row h2{margin:0}
.tip{display:block;font-size:14px;color:var(--gold);margin-top:6px}
.it{padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.bell{background:none;border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:4px 10px;font:inherit;font-size:14px}.bell.on{color:var(--gold);border-color:var(--gold2)}
.btn.on{background:var(--gold);color:var(--on)}
.card.fo{transition:all .5s cubic-bezier(.4,0,.2,1);opacity:0;transform:translateX(-36px) scale(.92);height:0!important;padding-top:0;padding-bottom:0;margin-bottom:0;border-width:0}
.nosel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ct{color:var(--gold);margin:0 0 6px;font-size:20px}.st{padding:10px 0;border-top:1px solid var(--line)}.stl{color:var(--gold);font-weight:700;font-size:16px}
.fin{padding:24px 16px;animation:breathe 4s ease-in-out infinite,in .6s ease}
.fin .z{font-size:20px;line-height:2.2}
#sheet{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);align-items:flex-end}
.sb{width:100%;max-height:80%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const PREF=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences;
const S={get(k,d){try{return JSON.parse(localStorage.getItem('iman_'+k))??d}catch(e){return d}},set(k,v){const j=JSON.stringify(v);try{localStorage.setItem('iman_'+k,j)}catch(e){}try{const p=PREF();p&&p.set({key:'iman_'+k,value:j})}catch(e){}}};
async function hydrate(){const p=PREF();if(!p)return;try{const r=await p.keys();for(const k of r.keys){if(k.indexOf('iman_')==0){const v=await p.get({key:k});if(v.value!=null)localStorage.setItem(k,v.value)}}}catch(e){}}
function wipe(){localStorage.clear();try{const p=PREF();p&&p.clear()}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
const vib=n=>{try{const h=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;if(h){Array.isArray(n)?h.notification({type:'SUCCESS'}):h.impact({style:n>25?'MEDIUM':'LIGHT'})}else if(navigator.vibrate)navigator.vibrate(n)}catch(e){}};
const ring=(p,l,c)=>{const r=32,C=2*Math.PI*r;return `<div class="ring ${p>=1?'done':''}${c?' pulse':''}"><svg width="76" height="76"><circle class="bg" cx="38" cy="38" r="${r}"/><circle class="fg" cx="38" cy="38" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(p,1))}"/></svg><b>${l}</b></div>`};

/* ===== DATA ===== */
const SURAHS="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const TEXT={1:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ﴿١﴾ ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَـٰلَمِينَ ﴿٢﴾ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ﴿٣﴾ مَـٰلِكِ يَوْمِ ٱلدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ ﴿٦﴾ صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ ﴿٧﴾",
112:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ ﴿١﴾ ٱللَّهُ ٱلصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ ﴿٤﴾",
113:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",
114:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ﴿١﴾ مَلِكِ ٱلنَّاسِ ﴿٢﴾ إِلَـٰهِ ٱلنَّاسِ ﴿٣﴾ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ﴿٤﴾ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ﴿٥﴾ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ ﴿٦﴾"};
const JUZ_START=[1,2,2,3,4,4,5,6,7,8,9,11,12,15,17,18,21,23,25,27,29,33,36,39,41,46,51,58,67,78];
const Q=t=>"<span class='qv'>"+t+"</span>";
const KURSI=Q("ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ");
const THREE=Q(TEXT[112])+Q(TEXT[113])+Q(TEXT[114]);
const SAYY="سَيِّدُ الِاسْتِغْفَارِ: اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ";
const SAYY_S="«مَنْ قَالَهَا مِنَ النَّهَارِ مُوقِنًا بِهَا فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ فَهُوَ مِنْ أَهْلِ الْجَنَّةِ، وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهُوَ مُوقِنٌ بِهَا فَمَاتَ قَبْلَ أَنْ يُصْبِحَ فَهُوَ مِنْ أَهْلِ الْجَنَّةِ» رواه البخاري";
const BISM=["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3,"«لَمْ يَضُرَّهُ شَيْءٌ» رواه أبو داود والترمذي وصححه الألباني"];
const RADI=["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",3,"«كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ» رواه أحمد وأبو داود وحسنه الألباني"];
const AFIN=["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ",3,"من دعاء النبي ﷺ صباحاً ومساءً. رواه أبو داود وحسنه الألباني"];
const KAL=["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3,"«لَمْ تَضُرَّهُ حُمَةٌ تِلْكَ اللَّيْلَةَ» رواه مسلم"];

const PER={dawn:["#7a5cc8","#f0a878","بارك الله في فجرك","اجعل أول يومك ذكراً وصلاة"],morning:["#3aa6a0","#f2d98a","صباح النور","لا تنس أذكار الصباح وورد القرآن"],asr:["#c98a3a","#3a6ea8","عصر مبارك","حافظ على العصر وأذكار المساء"],maghrib:["#d4574a","#5a3a8a","مساء الخير","وقت أذكار المساء والدعاء"],night:["#0a1a4a","#2a1a5a","ليلة هادئة","اختم يومك بالوتر وأذكار النوم"]};
function period(){const n=new Date(),t=pt(n),f=t[0][1],a=t[2][1],m=t[3][1],i=t[4][1];if(n<f||n>=i)return 'night';if(n<new Date(f.getTime()+54e5))return 'dawn';if(n<a)return 'morning';if(n<m)return 'asr';return 'maghrib'}
function applySky(){const p=PER[period()],r=document.documentElement;r.style.setProperty('--s1',p[0]);r.style.setProperty('--s2',p[1]);renderGreet()}
function renderGreet(){const g=$('#gt');if(!g)return;const p=PER[period()];g.textContent=p[2]+(ST.name?'، '+ST.name:'');$('#gs').textContent=p[3]}
function particles(){const c=$('#pc');if(!c||!c.getContext)return;const x=c.getContext('2d');let W,H;const P=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<30;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,s:Math.random()*.25+.08,d:Math.random()*6});
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
(function f(t){if(!document.hidden){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.s;p.x+=Math.sin(t/2000+p.d)*.25;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(212,175,90,'+(.2+.25*Math.sin(t/900+p.d))+')';x.fill()})}requestAnimationFrame(f)})(0)}

let LOC=S.get('loc',{lat:32.22,lng:35.26});
function pt(dt){const rad=Math.PI/180,{lat,lng}=LOC,tz=-dt.getTimezoneOffset()/60;
const D=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/864e5+2440587.5-2451545;
const g=(357.529+.98560028*D)%360,q=(280.459+.98564736*D)%360,L=q+1.915*Math.sin(g*rad)+.02*Math.sin(2*g*rad),e=23.439-4e-7*D;
let RA=Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))/rad/15;RA=(RA+24)%24;
let eq=q/15-RA;eq=((eq+12)%24+24)%24-12;
const dec=Math.asin(Math.sin(e*rad)*Math.sin(L*rad))/rad,noon=12+tz-lng/15-eq;
const T=h=>Math.acos((Math.sin(h*rad)-Math.sin(lat*rad)*Math.sin(dec*rad))/(Math.cos(lat*rad)*Math.cos(dec*rad)))/rad/15;
const A=Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*rad)))/rad;
const base=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime();
const mk=h=>new Date(base+h*36e5);
return [["الفجر",mk(noon-T(-18))],["الظهر",mk(noon)],["العصر",mk(noon+T(A))],["المغرب",mk(noon+T(-.833))],["العشاء",mk(noon+T(-17))]]}
function nextPrayer(){const n=new Date();let l=pt(n).find(p=>p[1]>n);if(!l){const t=new Date(n.getTime()+864e5);l=pt(t)[0]}return l}
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{LOC={lat:p.coords.latitude,lng:p.coords.longitude};S.set('loc',LOC);applySky()},()=>{},{timeout:8000});

let qmode='s',qsearch='',QDATA=null,QF=S.get('qfs',26),curS=0;
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const nz=s=>s.replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const BASM="بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";
function applyQF(){document.documentElement.style.setProperty('--qfs',QF+'px')}
function qfs(d){QF=Math.max(18,Math.min(48,QF+d));S.set('qfs',QF);applyQF()}
function loadQuran(){try{fetch('quran.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(j&&j.s&&j.s.length==114){QDATA=j.s;if(curPg=='quran'&&!curS)renderQuran()}}).catch(()=>{})}catch(e){}}
function ayahs(n){if(QDATA)return QDATA[n-1];const t=TEXT[n];if(!t)return null;const a=t.split(/\s*﴿[^﴾]*﴾\s*/).map(x=>x.trim()).filter(Boolean);if(n!=1)a[0]=a[0].split(' ').slice(4).join(' ');return a.map(x=>[x,null,null])}
function bms(){let b=S.get('bms',null);if(!b){const o=S.get('bm',null);b=o?[{s:o,name:SURAHS[o-1],page:null,a:1,ts:0}]:[]}return b}
function pageOf(s,a){const x=ayahs(s);return x&&x[a-1]?x[a-1][1]:null}
function toggleBm(s,a){const b=bms(),i=b.findIndex(x=>x.s==s&&x.a==a);if(i>=0)b.splice(i,1);else b.unshift({s,name:SURAHS[s-1],page:pageOf(s,a),a,ts:Date.now()});S.set('bms',b);vib(20);paintBm(s);renderHome()}
function delBm(i){const b=bms();b.splice(i,1);S.set('bms',b);renderHome();qlist()}
function paintBm(s){const b=bms();document.querySelectorAll('#quran .ay').forEach(e=>{const a=+e.dataset.a;e.classList.toggle('bk',b.some(x=>x.s==s&&x.a==a));e.classList.toggle('hl',!!b[0]&&b[0].s==s&&b[0].a==a)})}
function juzPos(j){if(QDATA)for(let s=0;s<114;s++){const i=QDATA[s].findIndex(v=>v[2]==j);if(i>=0)return[s+1,i+1]}return[JUZ_START[j-1],1]}
function openJuz(j){const p=juzPos(j);openSurah(p[0],p[1])}
function renderQuran(){curS=0;$('#quran').innerHTML=`<h2>القرآن الكريم</h2><input id="qs" placeholder="ابحث باسم السورة أو رقمها" value="${qsearch}"><div class="tabs">${[['s','السور (114)'],['j','الأجزاء (30)'],['b','العلامات']].map(t=>`<button class="btn ${qmode==t[0]?'on':''}" onclick="qmode='${t[0]}';renderQuran()">${t[1]}</button>`).join('')}</div><div id="ql"></div>`;
$('#qs').oninput=e=>{qsearch=e.target.value.trim();qlist()};qlist()}
function qlist(){const k=nz(qsearch);let h='';
if(qmode=='b'){const b=bms();h=b.length?b.map((x,i)=>`<div class="card row" onclick="openSurah(${x.s},${x.a})"><div><b>سورة ${x.name}، آية ${toAr(x.a)}</b><div class="mut">${x.page?'صفحة '+toAr(x.page)+' — ':''}رقم السورة ${toAr(x.s)}${i==0?' — آخر موضع قراءة':''}</div></div><button class="btn" onclick="event.stopPropagation();delBm(${i})">حذف</button></div>`).join(''):'<div class="card mut">لا علامات بعد. افتح سورة واضغط على رقم أي آية لإضافة علامة عندها.</div>'}
else{let list=qmode=='s'?SURAHS.map((n,i)=>[i+1,'سورة '+n,'رقمها '+(i+1),`openSurah(${i+1})`]):JUZ_START.map((s,i)=>[i+1,'الجزء '+(i+1),'يبدأ من سورة '+SURAHS[s-1],`openJuz(${i+1})`]);
list=list.filter(x=>!k||nz(x[1]).includes(k)||(qmode=='s'&&String(x[0])==k)||(qmode=='j'&&String(x[0])==k));
const bm=bms();h=list.length?list.map(x=>`<div class="card row" onclick="${x[3]}"><div><b>${x[1]}</b><div class="mut">${x[2]}</div></div><span>${qmode=='s'&&bm.some(y=>y.s==x[0])?'🔖':''}</span></div>`).join(''):'<div class="card mut">لا نتائج. جرّب اسماً أو رقماً آخر.</div>'}
$('#ql').innerHTML=h}
function openSurah(n,a){const x=ayahs(n);curS=n;
let h=`<div class="row"><button class="btn" onclick="renderQuran()">‹ رجوع</button><div class="row" style="gap:6px"><button class="btn" onclick="qfs(-2)" aria-label="تصغير الخط">أ−</button><button class="btn" onclick="qfs(2)" aria-label="تكبير الخط">أ＋</button></div></div><h2 style="text-align:center;margin-top:14px">سورة ${SURAHS[n-1]}</h2>`;
if(!x)h+='<div class="card mut">نص هذه السورة غير متوفر. شغّل الأمر npm run assets لتنزيل المصحف (quran.json) داخل مجلد www.</div>';
else{let pg=null,body='';x.forEach((v,i)=>{const an=i+1;if(v[1]&&v[1]!==pg){pg=v[1];body+=`<span class="pgm">صفحة ${toAr(pg)}</span>`}body+=`<span class="ay" id="ay${an}" data-a="${an}">${v[0]} <span class="an" data-a="${an}">﴿${toAr(an)}﴾</span></span> `});
h+=`<div class="card q">${n!=1&&n!=9?`<div class="bsm">${BASM}</div>`:''}${body}</div><div class="row"><button class="btn" ${n>1?`onclick="openSurah(${n-1})"`:'disabled'}>‹ السابقة</button><button class="btn" ${n<114?`onclick="openSurah(${n+1})"`:'disabled'}>التالية ›</button></div><p class="mut" style="text-align:center">اضغط على رقم الآية لإضافة العلامة أو إزالتها.</p>`}
$('#quran').innerHTML=h;paintBm(n);go('quran',true);
if(a){const e=document.getElementById('ay'+a);if(e&&e.scrollIntoView)setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),80)}}

/* ===== NOTIFICATIONS & REMINDERS ===== */
let NT=Object.assign({prayer:false},S.get('nt',{})),REM=S.get('rem',{}),TT={};const FIRED={};
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function askNotif(){try{const ln=LN();if(ln){const p=await ln.requestPermissions();return p.display==='granted'}if(window.Notification)return (await Notification.requestPermission())==='granted'}catch(e){}return false}
async function syncNotif(){const ln=LN();if(!ln)return;try{const pm=await ln.checkPermissions();if(pm.display!=='granted')return;try{await ln.createChannel({id:'iman',name:'تنبيهات إيمان',importance:4,visibility:1})}catch(e){}const pend=await ln.getPending();if(pend.notifications.length)await ln.cancel({notifications:pend.notifications});const L=[],now=new Date();
if(NT.prayer)for(let d=0;d<3;d++)pt(new Date(now.getTime()+d*864e5)).forEach((p,i)=>{if(p[1]>now)L.push({id:100+d*5+i,title:'حان وقت صلاة '+p[0],body:'قُم إلى الصلاة',channelId:'iman',schedule:{at:p[1],allowWhileIdle:true}})});
let n=0;Object.values(REM).forEach(r=>r.times.forEach(t=>{const hm=t.split(':').map(Number);L.push({id:200+(n++),title:r.t,body:'تذكير بعادتك في إيمان',channelId:'iman',schedule:{on:{hour:hm[0],minute:hm[1]},repeats:true,allowWhileIdle:true}})}));
if(L.length)await ln.schedule({notifications:L.slice(0,60)})}catch(e){}}
function webNotify(t,b){if(!LN()&&window.Notification&&Notification.permission==='granted'){try{new Notification(t,{body:b})}catch(e){}}}
function tickNotif(){if(LN())return;const n=new Date(),hm=n.toTimeString().slice(0,5),d=today();
if(NT.prayer)pt(n).forEach(p=>{const k='p'+d+p[0];if(p[1].toTimeString().slice(0,5)==hm&&!FIRED[k]){FIRED[k]=1;webNotify('حان وقت صلاة '+p[0],'قُم إلى الصلاة')}});
Object.keys(REM).forEach(id=>REM[id].times.forEach(t=>{const k=id+d+t;if(t==hm&&!FIRED[k]){FIRED[k]=1;webNotify(REM[id].t,'تذكير بعادتك في إيمان')}}))}
async function togglePrayer(){NT.prayer=!NT.prayer;if(NT.prayer){await askNotif();try{const ln=LN();if(ln&&ln.checkExactNotificationSetting){const e=await ln.checkExactNotificationSetting();if(e.exact_alarm!=='granted')await ln.changeExactNotificationSetting()}}catch(e){}}S.set('nt',NT);syncNotif();renderQibla()}
function saveRem(){S.set('rem',REM);syncNotif()}
function openRem(id){$('#sheet').style.display='flex';renderSheet(id)}
function closeSheet(){$('#sheet').style.display='none'}
function renderSheet(id){const r=REM[id]||{times:[]};$('#sheetbox').innerHTML=`<h2>تذكير: ${TT[id]||''}</h2>${r.times.length?r.times.map((t,j)=>`<div class="card row"><b>${t}</b><button class="btn" onclick="delRem('${id}',${j})">حذف</button></div>`).join(''):'<p class="mut">لا توجد أوقات تذكير بعد. أضف وقتاً أو أكثر.</p>'}<div class="row"><input type="time" id="rt" value="08:00" style="margin:0"><button class="btn" onclick="addRem('${id}')">＋ إضافة وقت</button></div><button class="btn" style="width:100%;margin-top:12px" onclick="closeSheet()">تم</button>`}
async function addRem(id){const v=$('#rt').value;if(!v)return;const r=REM[id]||(REM[id]={t:TT[id],times:[]});if(!r.times.includes(v))r.times.push(v);r.times.sort();saveRem();await askNotif();syncNotif();renderSheet(id);renderGuide()}
function delRem(id,j){REM[id].times.splice(j,1);if(!REM[id].times.length)delete REM[id];saveRem();renderSheet(id);renderGuide()}
function fxh(s){const m=[...s.matchAll(/رواه|متفق عليه/g)];if(!m.length)return `<div class="fd">${s}</div>`;const i=m[m.length-1].index,f=s.slice(0,i).replace(/[\s.،:]+$/,''),t=s.slice(i);return (f?`<div class="fd">${f}</div>`:'')+`<div class="tk">التخريج: ${t}</div>`}

return `<div class="card nosel" data-k="${k}">${body}</div>`}).join('')+
(items.length?'':`<div class="card fin"><div class="z" style="text-align:center">هنيئاً لك! جزاك الله خيراً وأثابك على وقتك وذكرك..<span class="qv">﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾</span><div style="font-size:28px;text-align:center">✨</div><button class="btn" style="display:block;margin:10px auto 0" onclick="resetSection()">↺ إعادة الأذكار</button></div></div>`)}

const cd=el&&el.closest?el.closest('.card'):null;
if(fin&&cd){cd.style.height=cd.offsetHeight+'px';cd.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>cd.classList.add('fo')));setTimeout(renderAdhkar,560)}else renderAdhkar()}

function resetSection(){const c=S.get('cnt',{});if(c.d==today()){AD[acat].forEach((a,i)=>{delete c[acat+i]});S.set('cnt',c)}vib([30,30,30]);renderAdhkar()}
(function(){const el=$('#adhkar'),en=()=>clearTimeout(lpTimer);

let cmpOn=false;
function renderQibla(){const{lat,lng}=LOC,r=Math.PI/180,dl=(39.8262-lng)*r,y=Math.sin(dl),x=Math.cos(lat*r)*Math.tan(21.4225*r)-Math.sin(lat*r)*Math.cos(dl);window.QB=(Math.atan2(y,x)/r+360)%360;

<div class="card"><b>الإشعارات</b><p class="mut">تنبيه عند دخول وقت كل صلاة. بعد التحويل إلى APK تعمل والتطبيق مغلق.</p><button class="btn ${NT.prayer?'on':''}" onclick="togglePrayer()">${NT.prayer?'🔔 مفعّلة':'🔕 غير مفعّلة'}</button></div>
<div class="card"><b>البيانات</b><p class="mut">يعمل إيمان دون اتصال، وتُحفظ بياناتك على جهازك فقط.</p><button class="btn" onclick="if(confirm('حذف كل البيانات المحفوظة؟')){wipe();ST=Object.assign({},DEFST);applyST();applySky();renderAll()}">حذف جميع البيانات</button></div>`}
function startCompass(){if(cmpOn)return;const h=e=>{const a=e.webkitCompassHeading??(e.alpha!=null?360-e.alpha:null);if(a==null||!$('#dial'))return;const d=(window.QB-a+360)%360;$('#dial').style.transform=`rotate(${d}deg)`;const q=$('#qi');if(q)q.textContent=(d<5||d>355)?'✔ أنت باتجاه القبلة':'زاوية القبلة: '+Math.round(QB)+'°'};
const on=()=>{cmpOn=true;addEventListener('deviceorientationabsolute',h,true);addEventListener('deviceorientation',h,true)};
