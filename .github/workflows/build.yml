name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html fetch-assets.js www/ 2>/dev/null || true
          npm run build --if-present

      - name: Build Android Release APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename & Align APK
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release-unsigned.apk EMAN-APP.apk || mv app-release.apk EMAN-APP.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMAN-Android-APK
          path: android/app/build/outputs/apk/release/EMAN-APP.apk
